<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- parchment-toned monogram for AI4BayesCode -->
  <!-- subtle ring -->
  <circle cx="32" cy="32" r="28" stroke="rgb(78 78 168)" stroke-width="1.5" fill="rgb(253 252 255)"/>
  <!-- inner Bayesian-flavored mark: a small density curve under a B -->
  <text x="32" y="38" text-anchor="middle"
        font-family="'Lora', Georgia, serif"
        font-size="26"
        font-weight="600"
        font-style="italic"
        fill="rgb(20 18 38)">B</text>
  <!-- a tiny normal-curve underline -->
  <path d="M 18 50 Q 22 44, 26 47 Q 30 52, 32 44 Q 34 36, 38 47 Q 42 50, 46 44"
        stroke="rgb(78 78 168)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
</svg>
